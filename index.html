<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Updates — Julphar Pharmaceutical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #F2F4F7;
    --panel: #FFFFFF;
    --hairline: #DEE2E8;
    --primary: #21466C;
    --secondary: #1A85C6;
    --text-body: #333B45;
    --muted: #6B7280;
    --ok: #2F7A4F;
    --warn: #B4680A;
    --tag-critical-bg: #FBEAEA;
    --tag-critical-fg: #A23B3B;
    --tag-feature-bg: #E9F0FA;
    --tag-feature-fg: #1A5A8C;
    --tag-patch-bg: #EAF3EC;
    --tag-patch-fg: #2F7A4F;
    --tag-eol-bg: #F3EFE8;
    --tag-eol-fg: #7A6A4F;
    --sev-critical-bg: #FBEAEA;
    --sev-critical-fg: #A23B3B;
    --sev-high-bg: #FDEEDD;
    --sev-high-fg: #B85C00;
    --sev-medium-bg: #FBF3D9;
    --sev-medium-fg: #8A6D00;
    --sev-low-bg: #EAF0F5;
    --sev-low-fg: #4C6579;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text-body);
    font-family: 'Inter', 'Segoe UI', sans-serif;
    height: 100%;
    overflow: hidden;
  }

  .board{
    display:flex;
    flex-direction:column;
    height:100vh;
    width:100vw;
  }

  /* ---- Header bar ---- */
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--primary);
    padding: 18px 30px;
    flex-shrink:0;
  }

  .header-left{
    display:flex;
    align-items:center;
    gap: 20px;
  }

  .header-logo{
    height: 28px;
    width: auto;
    flex-shrink: 0;
    display: block;
  }

  .header-divider{
    width: 1px;
    height: 30px;
    background: rgba(255, 255, 255, 0.28);
    flex-shrink: 0;
  }

  .title-block{
    display:flex;
    flex-direction:column;
    gap: 3px;
  }

  .title{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:700;
    font-size: 24px;
    letter-spacing: 0.02em;
    color: #FFFFFF;
    margin:0;
    line-height:1.1;
  }

  .subtitle{
    font-size: 12px;
    color: #AFC6DC;
    font-family:'IBM Plex Mono', monospace;
    letter-spacing: 0.06em;
  }

  .header-right{
    display:flex;
    align-items:center;
    gap: 24px;
  }

  .status-dots{
    display:flex;
    gap: 6px;
    align-items:center;
  }

  .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--ok);
  }
  .dot.stale{ background: #7F93A8; }
  .dot.error{ background: var(--warn); }

  .clock-block{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap: 2px;
  }

  .clock{
    font-family:'IBM Plex Mono', monospace;
    font-size: 19px;
    font-weight:500;
    color: #FFFFFF;
    min-width: 92px;
    text-align:right;
  }

  .clock-date{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:500;
    color: #AFC6DC;
    letter-spacing: 0.05em;
    text-align:right;
    white-space:nowrap;
  }

  .error-banner{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #F0C48C;
  }

  /* ---- Main split: dashboard 80% / ticker 20% ---- */
  /* ---- Featured slider: full-bleed white section, flush with header ---- */
  .featured-section{
    flex: 1;
    display:flex;
    background: var(--panel);
    min-height: 0;
    width: 100%;
  }

  .featured-card{
    flex: 1;
    background: var(--panel);
    padding: 28px 40px;
    display:flex;
    align-items:flex-start;
    min-height: 0;
    width: 100%;
    position:relative;
    overflow:hidden;
  }

  .main-content{
    flex-shrink: 0;
    display:flex;
    flex-direction:column;
    padding: 16px 20px;
    gap: 12px;
  }

  /* ---- Summary strip: one line, vendor + 7-day vulnerability count ---- */
  .summary-strip{
    flex-shrink: 0;
    height: 60px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    display:flex;
    align-items:center;
    padding: 0 22px;
    gap: 0;
    overflow:hidden;
  }

  .summary-label-block{
    display:flex;
    flex-direction:column;
    gap: 2px;
    flex-shrink:0;
    margin-right: 22px;
    padding-right: 22px;
    border-right: 1px solid var(--hairline);
  }

  .summary-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .summary-sublabel{
    font-family:'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0.75;
  }

  .summary-chips{
    flex:1;
    display:flex;
    align-items:center;
    gap: 20px;
    overflow:hidden;
    min-width:0;
  }

  .summary-chip{
    display:flex;
    align-items:baseline;
    gap: 6px;
    flex-shrink:0;
  }

  .summary-chip-name{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size: 13px;
    color: var(--primary);
    white-space:nowrap;
  }

  .summary-chip-count{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size: 16px;
    color: var(--secondary);
  }

  .section-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .featured-slide{
    width:100%;
    max-width: 100%;
    display:flex;
    flex-direction:column;
    min-height:0;
    overflow:hidden;
  }

  .featured-slide.slide-in{
    animation: slideIn 0.45s ease-out both;
  }
  @keyframes slideIn{
    0%{ transform: translateX(36px); opacity:0; }
    100%{ transform: translateX(0); opacity:1; }
  }

  .featured-label-row{
    display:flex;
    align-items:center;
    gap: 12px;
    margin: 0 0 18px;
    flex-shrink:0;
  }

  .featured-vendor-label{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size: 16px;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 7px 16px;
    background: rgba(33, 70, 108, 0.08);
    border-radius: 4px;
    white-space:nowrap;
  }

  .featured-title{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:700;
    font-size: 36px;
    line-height:1.3;
    color: var(--primary);
    margin: 0;
    max-width: 100%;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .featured-summary{
    font-size: 23px;
    line-height:1.6;
    color: var(--text-body);
    max-width: 92%;
    margin-top: 20px;
    display: -webkit-box;
    -webkit-line-clamp: 9;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .featured-date{
    font-family:'IBM Plex Mono', monospace;
    font-size: 15px;
    color: var(--muted);
    margin-top: 22px;
    flex-shrink:0;
  }

  .featured-dots{
    position:absolute;
    right: 30px;
    bottom: 22px;
    display:flex;
    gap: 6px;
  }

  .featured-dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--hairline);
  }
  .featured-dot.active{
    background: var(--secondary);
  }

  .tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    text-transform:uppercase;
    letter-spacing: 0.05em;
    padding: 6px 12px;
    border-radius: 4px;
    font-weight:500;
    flex-shrink:0;
  }
  .tag.critical{ background:var(--tag-critical-bg); color:var(--tag-critical-fg); }
  .tag.feature{ background:var(--tag-feature-bg); color:var(--tag-feature-fg); }
  .tag.patch{ background:var(--tag-patch-bg); color:var(--tag-patch-fg); }
  .tag.eol{ background:var(--tag-eol-bg); color:var(--tag-eol-fg); }
  .tag.sev-critical{ background:var(--sev-critical-bg); color:var(--sev-critical-fg); }
  .tag.sev-high{ background:var(--sev-high-bg); color:var(--sev-high-fg); }
  .tag.sev-medium{ background:var(--sev-medium-bg); color:var(--sev-medium-fg); }
  .tag.sev-low{ background:var(--sev-low-bg); color:var(--sev-low-fg); }

  .tag.kev{
    background: #B91C1C;
    color: #FFFFFF;
    font-weight: 700;
  }

  .ticker-epss{
    font-family:'IBM Plex Mono', monospace;
    font-size: 14px;
    color: #93A6BB;
    white-space: nowrap;
  }

  .featured-relative-date{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--secondary);
    font-weight: 600;
    margin-left: 10px;
  }
  .tag.advisory{ background: rgba(26, 133, 198, 0.14); color: var(--secondary); }

  .placeholder-dash{
    color: var(--muted);
    font-size: 14px;
    font-style: italic;
  }

  /* ---- Ticker (20%) ---- */
  .ticker-wrap{
    flex-shrink: 0;
    height: 130px;
    display:flex;
    align-items:stretch;
    overflow:hidden;
    background: var(--primary);
    border-radius: 6px;
    min-height:0;
  }

  .ticker-label{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 0 20px;
    background: var(--secondary);
    color: #FFFFFF;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:700;
    font-size: 15px;
    line-height:1.3;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space:nowrap;
    position:relative;
    z-index:3;
  }

  .ticker-label::after{
    content:"";
    position:absolute;
    right:-18px;
    top:50%;
    transform:translateY(-50%);
    width:0;
    height:0;
    border-style:solid;
    border-width: 27px 0 27px 18px;
    border-color: transparent transparent transparent var(--secondary);
  }

  .ticker-scroll-area{
    flex:1;
    position:relative;
    overflow:hidden;
    min-width:0;
  }

  .ticker-scroll-area::before,
  .ticker-scroll-area::after{
    content:"";
    position:absolute;
    top:0; bottom:0;
    width: 90px;
    z-index:2;
    pointer-events:none;
  }
  .ticker-scroll-area::before{
    left:0;
    background: linear-gradient(to right, var(--primary), rgba(33,70,108,0));
  }
  .ticker-scroll-area::after{
    right:0;
    background: linear-gradient(to left, var(--primary), rgba(33,70,108,0));
  }

  .ticker-track{
    display:flex;
    align-items:center;
    white-space:nowrap;
    will-change: transform;
    height:100%;
  }

  .ticker-item{
    display:inline-flex;
    align-items:center;
    gap: 14px;
    padding: 0 40px;
    flex-shrink:0;
  }

  .ticker-vendor{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:700;
    font-size: 24px;
    letter-spacing: -0.005em;
    text-transform: uppercase;
    color: #A9D6F2;
  }

  .ticker-title{
    font-size: 26px;
    font-weight:700;
    color: #FFFFFF;
    background: rgba(26, 133, 198, 0.32);
    padding: 3px 10px;
    border-radius: 3px;
  }

  .ticker-cve-id{
    font-family:'IBM Plex Mono', monospace;
    font-size: 24px;
    font-weight:600;
    color: #FFFFFF;
    background: rgba(26, 133, 198, 0.32);
    padding: 3px 10px;
    border-radius: 3px;
    letter-spacing: 0.02em;
  }

  .ticker-summary{
    font-size: 19px;
    color: #C7D5E2;
    font-weight:400;
  }

  .ticker-date{
    font-family:'IBM Plex Mono', monospace;
    font-size: 16px;
    color: #93A6BB;
  }

  .ticker-sep{
    color: #4A6A8C;
    font-size: 14px;
    margin-left: 28px;
  }

  .placeholder{
    color: #93A5B8;
    font-size: 18px;
    font-style: italic;
    padding: 0 40px;
  }

  .footer-note{
    padding: 8px 22px 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    display:flex;
    justify-content:space-between;
    flex-shrink:0;
  }

  ::selection{ background: #DCEEFA; }
</style>
</head>
<body>

<div class="board">
  <div class="header">
    <div class="header-left">
      <img src="assets/julphar-logo.png" alt="Julphar" class="header-logo">
      <div class="header-divider"></div>
      <div class="title-block">
        <h1 class="title">GLOBAL TECHNOLOGY UPDATES</h1>
        <div class="subtitle" id="syncLine">LOADING…</div>
      </div>
    </div>
    <div class="header-right">
      <div class="error-banner" id="errorBanner"></div>
      <div class="status-dots" id="statusDots"></div>
      <div class="clock-block">
        <div class="clock" id="clock">--:--:--</div>
        <div class="clock-date" id="clockDate">---, -- --- ----</div>
      </div>
    </div>
  </div>

  <div class="featured-section">
    <div class="featured-card" id="featuredCard"></div>
  </div>

  <div class="main-content">
    <div class="summary-strip" id="summaryStrip"></div>

    <div class="ticker-wrap">
      <div class="ticker-label">Globally<br>Reported<br>Vulnerabilities</div>
      <div class="ticker-scroll-area">
        <div class="ticker-track" id="tickerTrack"></div>
      </div>
    </div>
  </div>

  <div class="footer-note">
    <span id="footerLeft">Data refreshes automatically in the background</span>
    <span id="footerRight"></span>
  </div>
</div>

<script>
  const VENDORS = [
    { name: "Microsoft",  mono: "MS"   },
    { name: "SAP",        mono: "SAP"  },
    { name: "Veeam",      mono: "VM"   },
    { name: "Cisco",      mono: "CS"   },
    { name: "VMware",     mono: "VW"   },
    { name: "Dell",       mono: "DL"   },
    { name: "Fortinet",   mono: "FT"   },
    { name: "Lenovo",     mono: "LN"   },
    { name: "Mimecast",   mono: "MC"   },
    { name: "CrowdStrike",mono: "CRWD" },
    { name: "Palo Alto Networks", mono: "PANW", short: "Palo Alto" }
  ];

  // How often the browser re-checks the data file for new content.
  // Matches the GitHub Action's own 30-minute refresh cadence (see workflow file).
  const POLL_MS = 30 * 60 * 1000; // 30 minutes
  const DATA_URL = "data/updates.json";

  // How often the featured card advances to the next update. Longer than
  // before since slides now carry more text — gives people time to read.
  const SLIDE_MS = 16000;

  let lastGoodData = null;
  let lastGoodNvd = null;
  let lastGeneratedAt = null;
  let slideTimer = null;
  let slideIndex = 0;

  function tagClassFor(item){
    if (item.category && ["critical","patch","feature","eol"].includes(item.category)) return item.category;
    const t = ((item.title || "") + " " + (item.summary || "")).toLowerCase();
    if (t.includes("critical") || t.includes("security") || t.includes("vulnerab") || t.includes("cve")) return "critical";
    if (t.includes("patch") || t.includes("hotfix") || t.includes("update kb") || t.includes("fix")) return "patch";
    if (t.includes("end of life") || t.includes("end-of-life") || t.includes("deprecat") || t.includes("retire")) return "eol";
    return "feature";
  }
  function tagLabelFor(cls){
    return { critical: "Critical", patch: "Patch", eol: "End of life", feature: "Update" }[cls];
  }

  const WEEKDAYS = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  const MONTHS_SHORT = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

  function renderClock(){
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour12:false });

    const dateEl = document.getElementById('clockDate');
    if (dateEl) {
      const wd = WEEKDAYS[now.getDay()];
      const day = String(now.getDate()).padStart(2, "0");
      const mon = MONTHS_SHORT[now.getMonth()];
      const year = now.getFullYear();
      dateEl.textContent = `${wd}, ${day} ${mon} ${year}`;
    }
  }
  setInterval(renderClock, 1000);
  renderClock();

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function relativeDate(isoDate){
    if (!isoDate) return '';
    const then = new Date(isoDate).getTime();
    if (isNaN(then)) return '';
    const days = Math.floor((Date.now() - then) / (24 * 60 * 60 * 1000));
    if (days <= 0) return 'Today';
    if (days === 1) return '1 day ago';
    if (days < 7) return `${days} days ago`;
    const weeks = Math.floor(days / 7);
    if (weeks === 1) return '1 week ago';
    return `${weeks} weeks ago`;
  }

  function setSyncLine(status){
    document.getElementById('syncLine').textContent = status;
  }

  function setStatusDots(state){
    const el = document.getElementById('statusDots');
    el.innerHTML = "";
    const dot = document.createElement('span');
    dot.className = 'dot' + (state === 'ok' ? '' : state === 'stale' ? ' stale' : ' error');
    el.appendChild(dot);
  }

  function updateFooter(){
    const right = document.getElementById('footerRight');
    right.textContent = lastGeneratedAt
      ? `Last data update ${new Date(lastGeneratedAt).toLocaleString([], { hour12:false })}`
      : '';
  }

  // ---- Featured card: sliding carousel through every vendor's update ----
  // Sorted by date only, no severity-based reordering, so every vendor gets
  // equal treatment in the rotation rather than "featuring" one over another.
  function buildSlideList(dataByVendor){
    const entries = VENDORS
      .map(v => dataByVendor && dataByVendor[v.name] ? { vendor: v, item: dataByVendor[v.name] } : null)
      .filter(Boolean);

    entries.sort((a, b) => {
      const aDate = a.item.date ? new Date(a.item.date).getTime() : 0;
      const bDate = b.item.date ? new Date(b.item.date).getTime() : 0;
      return bDate - aDate;
    });

    return entries;
  }

  function renderFeaturedSlide(slides){
    const card = document.getElementById('featuredCard');
    if (!card) return;

    if (slides.length === 0) {
      card.innerHTML = `<span class="placeholder-dash">Waiting for the first vendor update…</span>`;
      return;
    }

    if (slideIndex >= slides.length) slideIndex = 0;
    const { vendor: v, item } = slides[slideIndex];
    const cls = tagClassFor(item);

    const dotsHtml = slides.map((_, i) => `<span class="featured-dot${i === slideIndex ? ' active' : ''}"></span>`).join('');

    card.innerHTML = `
      <div class="featured-slide slide-in">
        <div class="featured-label-row">
          <span class="featured-vendor-label">${v.name}</span>
          <span class="tag ${cls}">${tagLabelFor(cls)}</span>
        </div>
        <h2 class="featured-title">${escapeHtml(item.title || 'Untitled update')}</h2>
        <p class="featured-summary">${escapeHtml(item.summary || '')}</p>
        <div class="featured-date">${item.date || '—'}<span class="featured-relative-date">${relativeDate(item.date)}</span></div>
      </div>
      <div class="featured-dots">${dotsHtml}</div>
    `;
  }

  function startSlideTimer(slides){
    if (slideTimer) clearInterval(slideTimer);
    if (slides.length <= 1) return;
    slideTimer = setInterval(() => {
      slideIndex = (slideIndex + 1) % slides.length;
      renderFeaturedSlide(slides);
    }, SLIDE_MS);
  }

  // ---- Summary strip: one line, vendor name + 7-day vulnerability count ----
  // Counts come from NVD (actual reported vulnerabilities), not the vendor
  // feed's post count.
  function renderSummaryStrip(nvdByVendor){
    const strip = document.getElementById('summaryStrip');
    const chipsHtml = VENDORS.map(v => {
      const count = nvdByVendor && nvdByVendor[v.name] && typeof nvdByVendor[v.name].count === 'number'
        ? nvdByVendor[v.name].count
        : 0;
      return `
        <div class="summary-chip">
          <span class="summary-chip-name">${v.short || v.name}</span>
          <span class="summary-chip-count">${count}</span>
        </div>
      `;
    }).join('');

    strip.innerHTML = `
      <div class="summary-label-block">
        <span class="summary-label">Vulnerability Summary</span>
        <span class="summary-sublabel">Past 7 days</span>
      </div>
      <div class="summary-chips">${chipsHtml}</div>
    `;
  }

  function renderDashboard(dataByVendor){
    const slides = buildSlideList(dataByVendor);
    slideIndex = 0;
    renderFeaturedSlide(slides);
    startSlideTimer(slides);
  }

  // ---- Ticker: full detail (vendor, tag, headline, summary, date) ----
  const TICKER_SPEED = 85; // pixels per second
  let tickerPos = 0;
  let tickerHalfWidth = 0;
  let tickerLastFrame = null;

  function tickerLoop(ts){
    if (tickerLastFrame == null) tickerLastFrame = ts;
    const dt = (ts - tickerLastFrame) / 1000;
    tickerLastFrame = ts;

    if (tickerHalfWidth > 0) {
      tickerPos -= TICKER_SPEED * dt;
      if (tickerPos <= -tickerHalfWidth) {
        tickerPos += tickerHalfWidth;
      }
      const track = document.getElementById('tickerTrack');
      if (track) track.style.transform = `translateX(${tickerPos}px)`;
    }
    requestAnimationFrame(tickerLoop);
  }
  requestAnimationFrame(tickerLoop);

  function severityTagClass(severity){
    const s = (severity || '').toUpperCase();
    if (s === 'CRITICAL') return 'sev-critical';
    if (s === 'HIGH') return 'sev-high';
    if (s === 'MEDIUM') return 'sev-medium';
    if (s === 'LOW') return 'sev-low';
    return 'sev-low';
  }

  function severityLabel(severity){
    const s = (severity || '').toUpperCase();
    if (['CRITICAL','HIGH','MEDIUM','LOW'].includes(s)) {
      return s.charAt(0) + s.slice(1).toLowerCase();
    }
    return 'Unrated';
  }

  function buildNvdTickerItemHtml(v, cve){
    const sevCls = severityTagClass(cve.severity);
    const kevBadge = cve.kev ? `<span class="tag kev">⚠ Actively Exploited</span>` : '';
    const epssBadge = typeof cve.epss === 'number' ? `<span class="ticker-epss">EPSS ${cve.epss.toFixed(1)}%</span>` : '';
    return `
      <div class="ticker-item">
        <span class="ticker-vendor">${v.name}</span>
        <span class="tag ${sevCls}">${severityLabel(cve.severity)}</span>
        ${kevBadge}
        <span class="ticker-cve-id">${escapeHtml(cve.id)}</span>
        <span class="ticker-summary">${escapeHtml(cve.title || '')}</span>
        <span class="ticker-date">${relativeDate(cve.date)}</span>
        ${epssBadge}
        <span class="ticker-sep">●</span>
      </div>
    `;
  }

  // Official vendor advisory feeds that are genuinely vulnerability-specific
  // (not general product blogs) — currently Microsoft's MSRC update guide
  // and Cisco's PSIRT feed. Shown in the ticker alongside NVD, tagged
  // distinctly as "Advisory" since they're not CVSS-scored the way NVD
  // records are.
  const ADVISORY_SOURCE_VENDORS = ["Microsoft", "Cisco"];

  function buildAdvisoryTickerItemHtml(v, item){
    return `
      <div class="ticker-item">
        <span class="ticker-vendor">${v.name}</span>
        <span class="tag advisory">Advisory</span>
        <span class="ticker-title">${escapeHtml(item.title || 'Untitled advisory')}</span>
        <span class="ticker-summary">${escapeHtml(item.summary || '')}</span>
        <span class="ticker-date">${item.date || ''}</span>
        <span class="ticker-sep">●</span>
      </div>
    `;
  }

  // Ticker draws from NVD (all vendors) plus each vendor's own official
  // vulnerability-advisory feed where one exists (currently Microsoft/Cisco).
  // General product blogs are intentionally excluded — this stays a
  // vulnerability-focused ticker, not a news ticker.
  function renderTicker(dataByVendor, nvdByVendor){
    const track = document.getElementById('tickerTrack');
    const itemsHtml = [];

    VENDORS.forEach(v => {
      if (ADVISORY_SOURCE_VENDORS.includes(v.name) && dataByVendor && dataByVendor[v.name]) {
        itemsHtml.push(buildAdvisoryTickerItemHtml(v, dataByVendor[v.name]));
      }
      const cves = (nvdByVendor && nvdByVendor[v.name] && nvdByVendor[v.name].items) || [];
      cves.forEach(cve => itemsHtml.push(buildNvdTickerItemHtml(v, cve)));
    });

    if (itemsHtml.length === 0) {
      track.style.transform = 'translateX(0px)';
      tickerPos = 0;
      tickerHalfWidth = 0;
      track.innerHTML = `<div class="ticker-item"><span class="placeholder">Waiting for vulnerability data…</span></div>`;
      return;
    }

    const singleSet = itemsHtml.join('');
    track.innerHTML = singleSet + singleSet;
    tickerHalfWidth = track.scrollWidth / 2;
  }

  function renderAll(dataByVendor, nvdByVendor){
    renderDashboard(dataByVendor);
    renderSummaryStrip(nvdByVendor);
    renderTicker(dataByVendor, nvdByVendor);
  }

  async function loadData(){
    document.getElementById('errorBanner').textContent = "";

    try {
      const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      const dataByVendor = json.vendors || {};
      const nvdByVendor = json.nvd || {};

      if (Object.keys(dataByVendor).length === 0 && !lastGoodData) {
        setSyncLine("WAITING FOR FIRST SYNC");
        setStatusDots('stale');
        renderAll(null, null);
        updateFooter();
        return;
      }

      lastGoodData = Object.keys(dataByVendor).length ? dataByVendor : lastGoodData;
      lastGoodNvd = Object.keys(nvdByVendor).length ? nvdByVendor : lastGoodNvd;
      lastGeneratedAt = json.generatedAt || lastGeneratedAt;
      renderAll(lastGoodData, lastGoodNvd);
      setSyncLine("LIVE");
      setStatusDots('ok');
      updateFooter();
    } catch (err) {
      console.error("data load failed", err);
      document.getElementById('errorBanner').textContent = "Couldn't load data/updates.json — showing last known data";
      if (lastGoodData) {
        renderAll(lastGoodData, lastGoodNvd);
        setSyncLine("STALE");
        setStatusDots('stale');
      } else {
        renderAll(null, null);
        setSyncLine("OFFLINE");
        setStatusDots('error');
      }
      updateFooter();
    }
  }

  renderAll(null, null);
  loadData();

  // A full reload every 30 minutes (instead of just re-fetching in place) is
  // deliberate: this page is expected to stay open on a TV for days or weeks
  // at a stretch, and a hard reload guarantees a genuinely fresh fetch and
  // resets any long-running JS/DOM state, rather than depending on a single
  // setInterval callback surviving unattended for that long.
  setTimeout(() => location.reload(), POLL_MS);
</script>

</body>
</html>
