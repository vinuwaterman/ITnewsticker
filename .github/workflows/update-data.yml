name: Update IT vendor data

on:
  schedule:
    # Runs every 30 minutes. GitHub may delay scheduled runs by a few minutes
    # during periods of high load — this is a GitHub Actions limitation, not
    # something this workflow can control.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest vendor updates
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/fetch-updates.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/updates.json
          git diff --quiet --cached || git commit -m "Update vendor data [skip ci]"
          git push
